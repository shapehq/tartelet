name: Tartelet
options:
  bundleIdPrefix: dk.shape
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: xcconfigs/General.xcconfig
  Release: xcconfigs/General.xcconfig
targets:
  Tartelet:
    scheme:
      testPlans:
        - path: Tartelet/Tartelet.xctestplan
          defaultPlan: true
    type: application
    platform: macOS
    sources: [Tartelet]
    postCompileScripts:
    - name: Bundle Command Line Tool
      script: |
        set -euo pipefail

        case "${CONFIGURATION}" in
          Release)
            SWIFT_CONFIGURATION="release"
            ;;
          *)
            SWIFT_CONFIGURATION="debug"
            ;;
        esac

        swift build \
          --package-path "${SRCROOT}/Packages/CLI" \
          -c "${SWIFT_CONFIGURATION}"

        CLI_BINARY="${SRCROOT}/Packages/CLI/.build/${SWIFT_CONFIGURATION}/tartelet"
        HELPERS_DIR="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"

        mkdir -p "${HELPERS_DIR}"
        cp "${CLI_BINARY}" "${HELPERS_DIR}/tartelet"
        chmod 755 "${HELPERS_DIR}/tartelet"

        if [ "${CODE_SIGNING_ALLOWED:-NO}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
          codesign \
            --force \
            --sign "${EXPANDED_CODE_SIGN_IDENTITY}" \
            --options runtime \
            "${HELPERS_DIR}/tartelet"
        fi
      basedOnDependencyAnalysis: false
    - name: Run SwiftLint
      path: scripts/swiftlint.sh
      basedOnDependencyAnalysis: false
    dependencies:
      - package: FileSystem
        products: [FileSystemData, FileSystemDomain]
      - package: GitHub
        products: [GitHubData, GitHubDomain]
      - package: Keychain
        products: Keychain
      - package: Logging
        products: [LoggingData, LoggingDomain]
      - package: MenuBar
        products: MenuBar
      - package: Networking
        products: [NetworkingData, NetworkingDomain]
      - package: Settings
        products: [SettingsData, SettingsDomain, SettingsUI]
      - package: Shell
        products: [ShellData, ShellDomain]
      - package: SSH
        products: [SSHData, SSHDomain]
      - package: VirtualMachine
        products: [VirtualMachineData, VirtualMachineDomain]
      - package: Composers
        products: Composers
localPackages:
  - Packages/CLI
  - Packages/Composers
  - Packages/FileSystem
  - Packages/GitHub
  - Packages/Keychain
  - Packages/Logging
  - Packages/MenuBar
  - Packages/Networking
  - Packages/Settings
  - Packages/SSH
  - Packages/Shell
  - Packages/VirtualMachine
